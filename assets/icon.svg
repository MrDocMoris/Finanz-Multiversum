  <rect x="754" y="470" width="70" height="330" rx="14" fill="#ff5ec8" opacity=".55"/>
</g>
<!-- Münze -->
<circle cx="512" cy="500" r="270" fill="#7a4cff" opacity=".6" filter="url(#glow)"/>
<circle cx="512" cy="500" r="250" fill="url(#coin)" stroke="url(#ring)" stroke-width="16"/>
<circle cx="512" cy="500" r="200" fill="none" stroke="url(#ring)" stroke-width="6" opacity=".5"/>
<!-- leuchtendes Euro-Zeichen -->
